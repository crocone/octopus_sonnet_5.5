<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Jar Escape</title>
<style>
  :root{
    --amber:#ffb56b; --amber-2:#ff8f3c; --teal:#66d9c8; --ink:#07090b;
    --panel:rgba(12,16,18,.58); --line:rgba(255,190,120,.16); --text:#f4e7d4; --dim:rgba(244,231,212,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--text);overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
  canvas#c.drag{cursor:grabbing}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,transparent 42%,rgba(2,3,4,.62) 100%)}
  #grain{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #title{position:fixed;left:22px;top:18px;pointer-events:none;line-height:1.1}
  #title small{display:block;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--amber);opacity:.85}
  #title h1{margin:5px 0 0;font:400 25px/1.1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:.01em;color:#fbeedb}
  #hud{position:fixed;left:18px;bottom:18px;width:min(304px,calc(100vw - 36px));padding:14px 16px 15px;
    background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);user-select:none}
  #hud .k{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
  #phase{font:400 23px/1.15 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin:3px 0 1px;color:var(--amber);transition:color .4s}
  #sub{font-size:12px;color:var(--dim);min-height:16px;margin-bottom:11px}
  .rows{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
  .rows div{display:flex;flex-direction:column;gap:2px}
  .rows span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .rows b{font:500 19px/1.1 ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums;color:var(--text)}
  .rows b i{font-style:normal;font-size:12px;color:var(--dim);margin-left:3px}
  .bar{position:relative;height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:linear-gradient(90deg,var(--amber-2),var(--amber))}
  .steps{display:flex;gap:4px;margin-top:9px}
  .steps span{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.09);transition:background .4s}
  .steps span.on{background:var(--teal)}
  .steps span.cur{background:var(--amber)}
  #ctl{position:fixed;right:18px;top:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  #ctl button,#ctl label{font:500 12.5px/1 inherit;font-family:inherit;color:var(--text);background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);transition:background .2s,border-color .2s;display:inline-flex;gap:8px;align-items:center}
  #ctl button:hover,#ctl label:hover{background:rgba(255,160,80,.16);border-color:rgba(255,190,120,.4)}
  #ctl button:focus-visible,#ctl label:focus-within{outline:2px solid var(--amber);outline-offset:2px}
  #ctl button[aria-pressed="true"]{border-color:rgba(255,190,120,.45);background:rgba(255,150,70,.14)}
  #ctl kbd{font:600 10px/1 ui-monospace,Consolas,monospace;padding:3px 5px;border-radius:5px;background:rgba(255,255,255,.1);color:var(--dim)}
  #ctl input{accent-color:var(--amber-2);margin:0}
  #hint{position:fixed;right:20px;bottom:18px;font-size:11.5px;letter-spacing:.06em;color:var(--dim);pointer-events:none;text-align:right;line-height:1.6}
  #fade{position:fixed;inset:0;background:#040608;opacity:0;pointer-events:none;transition:opacity .9s ease}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#050709;
    font:400 20px/1 "Iowan Old Style",Georgia,serif;letter-spacing:.06em;color:var(--amber);transition:opacity .8s ease;z-index:9}
  #loading i{width:120px;height:2px;background:rgba(255,255,255,.1);position:relative;overflow:hidden;border-radius:2px}
  #loading i::after{content:"";position:absolute;inset:0;width:40%;background:var(--amber);animation:ld 1.1s ease-in-out infinite}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  #err{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(520px,88vw);padding:18px 22px;border-radius:12px;
    background:rgba(40,10,8,.9);border:1px solid rgba(255,120,90,.4);color:#ffd9cf;font-size:14px;line-height:1.5;display:none;z-index:10}
  @media (max-width:640px){
    #title{display:none}
    #hint{display:none}
    #ctl kbd{display:none}
    #ctl button,#ctl label{padding:8px 12px;font-size:12px}
    #ctl{right:10px;left:10px;top:10px;justify-content:center}
    #hud{left:10px;bottom:10px;padding:11px 13px}
    #phase{font-size:19px}
  }
  @media (prefers-reduced-motion:reduce){#grain{display:none}}
</style>

<body>
<canvas id="c" tabindex="0" aria-label="3D scene: an octopus unscrewing the lid of a glass jar"></canvas>
<div id="vignette"></div>
<div id="grain"></div>

<div id="title"><small>A small act of defiance</small><h1>The Jar Escape</h1></div>

<div id="ctl">
  <button id="btnPause" type="button" aria-label="Pause or resume"><span id="pauseLbl">Pause</span> <kbd>Space</kbd></button>
  <button id="btnReset" type="button" aria-label="Reset with a new jar">Reset <kbd>R</kbd></button>
  <button id="btnXray" type="button" aria-pressed="true" title="See through the cap while the tentacles work under it">X-ray <kbd>X</kbd></button>
  <label title="Start over with a fresh jar when the octopus is free"><input id="loop" type="checkbox" checked> Loop</label>
</div>

<div id="hud" aria-live="off">
  <div class="k">Phase</div>
  <div id="phase">Idle</div>
  <div id="sub">resting on the bottom, breathing</div>
  <div class="rows">
    <div><span>Lid rotation</span><b id="rot">0<i>°</i></b></div>
    <div><span>Lid height</span><b id="hgt">0.0<i>mm</i></b></div>
  </div>
  <div class="bar" title="Unscrewing progress"><i id="bar"></i></div>
  <div class="steps" id="steps"><span></span><span></span><span></span><span></span><span></span></div>
</div>

<div id="hint">drag &middot; orbit<br>scroll &middot; zoom<br>space &middot; pause<br>x &middot; x-ray</div>
<div id="fade"></div>
<div id="loading"><div>filling the jar&hellip;</div><i></i></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';

/* ======================================================================
   THE JAR ESCAPE — an octopus unscrews the lid from the inside.
   Everything is procedural: geometry, skin, wood, metal, glass, caustics.
   ====================================================================== */

const { Vector3: V3, Quaternion: Q, Matrix4: M4, Color: C } = THREE;
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const dampTo = (cur, target, lambda, dt) => cur + (target - cur) * (1 - Math.exp(-lambda * dt));

function mulberry(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rand = mulberry(20240611);

/* ---------- tileable value noise (used for the wood) ---------- */
function hash2(ix, iy, seed) {
  let h = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function tnoise(x, y, px, py, seed) {
  const x0 = Math.floor(x), y0 = Math.floor(y);
  const fx = x - x0, fy = y - y0;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const X0 = ((x0 % px) + px) % px, X1 = (X0 + 1) % px;
  const Y0 = ((y0 % py) + py) % py, Y1 = (Y0 + 1) % py;
  const a = hash2(X0, Y0, seed), b = hash2(X1, Y0, seed), c = hash2(X0, Y1, seed), d = hash2(X1, Y1, seed);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

/* ---------- error surface ---------- */
function showError(msg) {
  const e = $('err');
  e.style.display = 'block';
  e.textContent = msg;
  const l = $('loading'); if (l) l.style.display = 'none';
}
window.addEventListener('error', ev => showError('Something went wrong: ' + (ev.message || ev.error)));
window.addEventListener('unhandledrejection', ev => showError('Something went wrong: ' + (ev.reason && ev.reason.message || ev.reason)));

/* ---------- world constants (1 unit ≈ 34 mm) ---------- */
const MM = 34;
const LAMP = new V3(-6.6, 5.4, 3.4);
const JAR = {
  R: 1.25, Rin: 1.18, floor: 0.12,
  neckR: 0.715, neckIn: 0.595, rim: 3.43,
  sh0: 2.40, sh1: 3.02,
  water: 3.39,
};
const LID = { Y0: 3.15, pitch: 0.075, Hfree: 0.27, R: 0.80, H: 0.30, under: 0.25, turns: 0.27 / 0.075 };

/* ---------- renderer ---------- */
const canvas = $('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, stencil: true, powerPreference: 'high-performance' });
} catch (e) {
  showError('WebGL is not available in this browser, so the scene cannot be drawn.');
  throw e;
}
let PR = Math.min(window.devicePixelRatio || 1, 1.5);
const quality = { scale: 1 };
renderer.setPixelRatio(PR);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;

const scene = new THREE.Scene();
scene.background = new C(0x05070a);
scene.fog = new THREE.FogExp2(0x070a0c, 0.022);

const camera = new THREE.PerspectiveCamera(31, 1, 0.1, 90);

/* ---------- shared shader uniforms ---------- */
const U = {
  time: { value: 0 },
  lamp: { value: LAMP },
  jar: { value: new THREE.Vector4(JAR.R, 3.45, 0, 0) },
  focus: { value: 2.6 },
  refr: { value: null },
  env: { value: null },
  res: { value: new THREE.Vector2(1, 1) },
  viewProj: { value: new M4() },
  camPos: { value: new V3() },
  thud: { value: 0 },
};

/* ---------- orbit camera (drag to orbit, wheel / pinch to zoom) ---------- */
const orbit = {
  target: new V3(0.35, 1.7, 0), tTarget: new V3(0.35, 1.7, 0),
  az: -0.3, pol: 1.36, dist: 13.4,
  tAz: -0.3, tPol: 1.36, tDist: 13.4,
  shake: 0,
};
const pointers = new Map();
let pinchBase = 0, pinchDist0 = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.classList.add('drag');
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchBase = Math.hypot(a.x - b.x, a.y - b.y);
    pinchDist0 = orbit.tDist;
  }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    orbit.tAz -= dx * 0.0055;
    orbit.tPol = clamp(orbit.tPol - dy * 0.0055, 0.3, 1.72);
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchBase > 1) orbit.tDist = clamp(pinchDist0 * pinchBase / d, 5.5, 26);
  }
});
const endPointer = e => {
  pointers.delete(e.pointerId);
  if (!pointers.size) canvas.classList.remove('drag');
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  orbit.tDist = clamp(orbit.tDist * Math.exp(e.deltaY * 0.0011), 5.5, 26);
}, { passive: false });

function updateCamera(dt) {
  const k = 1 - Math.exp(-9 * dt);
  orbit.az += (orbit.tAz - orbit.az) * k;
  orbit.pol += (orbit.tPol - orbit.pol) * k;
  orbit.dist += (orbit.tDist - orbit.dist) * k;
  orbit.target.lerp(orbit.tTarget, 1 - Math.exp(-2.2 * dt));
  const sp = Math.sin(orbit.pol);
  camera.position.set(
    orbit.target.x + orbit.dist * sp * Math.sin(orbit.az),
    orbit.target.y + orbit.dist * Math.cos(orbit.pol),
    orbit.target.z + orbit.dist * sp * Math.cos(orbit.az));
  if (camera.position.y < 0.35) camera.position.y = 0.35;
  if (orbit.shake > 0.0005) {
    camera.position.y += Math.sin(performance.now() * 0.09) * orbit.shake;
    camera.position.x += Math.cos(performance.now() * 0.071) * orbit.shake * 0.6;
    orbit.shake *= Math.exp(-7 * dt);
  }
  camera.lookAt(orbit.target);
  camera.updateMatrixWorld();
  U.camPos.value.copy(camera.position);
}

/* ---------- refraction render target (scene without glass/water) ---------- */
let rt = null;
function resize() {
  const w = Math.max(2, window.innerWidth), h = Math.max(2, window.innerHeight);
  PR = Math.min(window.devicePixelRatio || 1, 1.5, Math.sqrt(3.4e6 / (w * h))) * quality.scale;
  renderer.setPixelRatio(PR);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // keep the whole action in frame on narrow screens
  camera.fov = w / h < 1.1 ? 31 * Math.min(1.9, 1.1 / (w / h)) : 31;
  camera.updateProjectionMatrix();
  const pw = Math.floor(w * PR), ph = Math.floor(h * PR);
  if (!rt) {
    rt = new THREE.WebGLRenderTarget(pw, ph, {
      type: THREE.HalfFloatType, samples: 2, depthBuffer: true,
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    });
    rt.texture.colorSpace = THREE.LinearSRGBColorSpace;
    U.refr.value = rt.texture;
  } else rt.setSize(pw, ph);
  U.res.value.set(pw, ph);
}
window.addEventListener('resize', resize);
resize();

/* ======================================================================
   ENVIRONMENT, ROOM, TABLE, LIGHTS
   ====================================================================== */

/* ---------- shared GLSL: animated water caustics ---------- */
const GLSL_CAUSTIC = /* glsl */`
float causticPattern(vec2 p, float t){
  vec2 q = mod(p * 6.28318, 6.28318) - 250.0;
  vec2 i = q; float c = 1.0; const float inten = 0.0055;
  for (int n = 0; n < 5; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = q + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(q.x / (sin(i.x + tt) / inten), q.y / (cos(i.y + tt) / inten)));
  }
  c /= 5.0;
  c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}
float h31(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn3(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z);
}
`;

/* ---------- procedural environment cube (lamp softbox, cool window, dim room) ---------- */
let envCube, envPMREM;
function buildEnvironment() {
  const es = new THREE.Scene();
  const box = new THREE.Mesh(new THREE.BoxGeometry(70, 40, 70),
    new THREE.MeshBasicMaterial({ color: new C().setRGB(0.010, 0.014, 0.018), side: THREE.BackSide }));
  box.position.y = 12; es.add(box);

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(70, 70),
    new THREE.MeshBasicMaterial({ color: new C().setRGB(0.055, 0.03, 0.016) }));
  floor.rotation.x = -Math.PI / 2; es.add(floor);

  const panel = (w, h, pos, rgb, look = new V3(0, 1.8, 0)) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new C().setRGB(rgb[0], rgb[1], rgb[2]), side: THREE.DoubleSide }));
    m.position.copy(pos); m.lookAt(look); es.add(m); return m;
  };
  // the warm lamp: tall soft box, the thing that paints the long highlight down the glass
  panel(2.6, 9.0, LAMP.clone().normalize().multiplyScalar(15).setY(6.0), [26, 15, 6.2]);
  panel(6, 1.6, new V3(-7, 11.5, 2), [3.2, 1.9, 0.9]);
  // cool window far right-back, teal spill
  panel(4.5, 8, new V3(11, 6.5, -9), [0.22, 0.52, 0.6]);
  panel(1.4, 6, new V3(-11, 5, -8), [0.35, 0.95, 1.05]);
  // faint warm bounce low on the camera side
  panel(10, 2, new V3(2, 0.6, 14), [0.25, 0.13, 0.06]);

  const cubeRT = new THREE.WebGLCubeRenderTarget(192, {
    type: THREE.HalfFloatType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter,
  });
  const cc = new THREE.CubeCamera(0.1, 120, cubeRT);
  cc.position.set(0, 1.8, 0);
  cc.update(renderer, es);
  envCube = cubeRT.texture;
  U.env.value = envCube;

  envPMREM = new THREE.PMREMGenerator(renderer);
  scene.environment = envPMREM.fromCubemap(envCube).texture;
  scene.environmentIntensity = 0.55;
  es.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
}
buildEnvironment();

/* ---------- wood (planks, grain, butt joints) ---------- */
function makeWoodTextures() {
  const N = 1024, PLANKS = 6;
  const colC = document.createElement('canvas'); colC.width = colC.height = N;
  const nrmC = document.createElement('canvas'); nrmC.width = nrmC.height = N;
  const cx = colC.getContext('2d'), nx = nrmC.getContext('2d');
  const img = cx.createImageData(N, N);
  const d = img.data;
  const hgt = new Float32Array(N * N);
  for (let y = 0; y < N; y++) {
    const pv = y / N * PLANKS, pk = Math.floor(pv), pl = pv - pk;
    const tone = hash2(pk, 3, 11), freq = 4 + hash2(pk, 5, 1) * 5, off = hash2(pk, 9, 2) * 40;
    const joint = hash2(pk, 1, 77), joint2 = (joint + 0.5) % 1;
    const knotX = hash2(pk, 12, 5), knotY = 0.25 + hash2(pk, 13, 6) * 0.5, hasKnot = hash2(pk, 14, 7) > 0.45;
    for (let x = 0; x < N; x++) {
      const u = x / N;
      const warp = tnoise(u * 4, pv * 2, 4, 12, 3) * 1.8 + tnoise(u * 2 + pk, pv * 3, 2, 18, 5) * 1.0;
      let phase = pl * freq + warp + off;
      if (hasKnot) {
        const dx = (u - knotX) * 6.0, dy = (pl - knotY) * 1.0;
        const kd = Math.hypot(dx, dy * 2.2);
        phase += 3.5 * Math.exp(-kd * kd * 6.0) / (0.25 + kd);
      }
      const ring = 0.5 + 0.5 * Math.sin(phase * TAU);
      const ringM = Math.pow(ring, 2.4);
      const fiber = tnoise(u * 6, pv * 70, 6, 420, 9);
      const fiber2 = tnoise(u * 22, pv * 240, 22, 1440, 4);
      let t = 0.46 + 0.22 * (tone - 0.5) + 0.16 * (fiber - 0.5) + 0.08 * (fiber2 - 0.5) - 0.30 * ringM;
      // plank edge gaps and butt joints
      let gap = 0;
      if (pl < 0.012 || pl > 0.990) gap = 1;
      const dj = Math.min(Math.abs(u - joint), Math.abs(u - joint2));
      if (dj < 0.0022 || dj > 0.9978) gap = 1;
      const bev = Math.min(pl, 1 - pl);
      // base colours: deep walnut → honey
      let r = 52 + 88 * t, g = 29 + 58 * t, b = 15 + 34 * t;
      const warm = 0.92 + 0.12 * tone;
      r *= warm; g *= 0.98 * warm; b *= 0.92;
      if (gap) { r = 10; g = 6; b = 4; }

function bez(p0, p1, p2, p3, n) {
  const out = [];

    const t = i / n, u = 1 - t;

      u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);
  }

}

  return out;

  [0.595, 3.30], [0.595, 3.0], ...shoulderIn.slice(1),

/* analytic lookups used by the soft-body / tentacle collision */
function makeLookup(pts) { // pts: [r,y]; returns r(y)
  const a = pts.slice().sort((p, q) => p[1] - q[1]);
  return y => {
    if (y <= a[0][1]) return a[0][0];
    if (y >= a[a.length - 1][1]) return a[a.length - 1][0];
    let lo = 0, hi = a.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (a[m][1] > y) hi = m; else lo = m; }
    const t = (y - a[lo][1]) / (a[hi][1] - a[lo][1] || 1);
    return lerp(a[lo][0], a[hi][0], t);
  };
}
const shOutLook = makeLookup(shoulderOut), shInLook = makeLookup(shoulderIn);
function rOutAt(y) {
  if (y < 0.28) return 0.97 + Math.sqrt(Math.max(0, 0.28 * 0.28 - (0.28 - y) * (0.28 - y)));
  if (y <= JAR.sh0) return JAR.R;

}
function rInAt(y) {

function jarOuterNormal(y, a, out) {

/* ---------- the thread: a helical ridge wound on the neck ---------- */
function buildThreadGeometry() {
  const turns = 4.3, steps = Math.round(turns * 56), y0 = 3.075, pitch = LID.pitch;
  // right-handed helix: y rises as the angle grows counter-clockwise seen from above
  const prof = [[-0.011, 0.0], [-0.0085, 0.038], [0, 0.058], [0.0085, 0.038], [0.011, 0.0]]; // [dy, dr]
  const rBase = JAR.neckR - 0.004;
  const pos = [], idx = [];
  const nP = prof.length;
  for (let i = 0; i <= steps; i++) {
    const phi = i / steps * turns * TAU;
    const yc = y0 + pitch * phi / TAU;
    const fade = sstep(0, 0.12, i / steps) * (1 - sstep(0.93, 1.0, i / steps)); // run-out at both ends
    for (let k = 0; k < nP; k++) {
      const r = rBase + prof[k][1] * fade;
      pos.push(r * Math.cos(phi), yc + prof[k][0], -r * Math.sin(phi));
    }
  }
  for (let i = 0; i < steps; i++) for (let k = 0; k < nP - 1; k++) {
    const a = i * nP + k, b = a + 1, c = a + nP, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ======================================================================

   ====================================================================== */

  gr.fillStyle = 'rgb(92,92,92)'; gr.fillRect(0, 0, S, S);
  const br = mulberry(5);
  // concentric brushed lines
  for (let i = 0; i < 2600; i++) {
    const r = br() * S * 0.5, a0 = br() * TAU, len = 0.3 + br() * 1.6;
    const l = br() > 0.5;
    g.strokeStyle = l ? `rgba(255,228,170,${0.03 + br() * 0.07})` : `rgba(50,28,8,${0.04 + br() * 0.08})`;
    g.lineWidth = 0.5 + br() * 1.2;
    g.beginPath(); g.arc(S / 2, S / 2, r, a0, a0 + len); g.stroke();
    gr.strokeStyle = l ? 'rgba(70,70,70,0.12)' : 'rgba(150,150,150,0.12)';
    gr.lineWidth = g.lineWidth; gr.beginPath(); gr.arc(S / 2, S / 2, r, a0, a0 + len); gr.stroke();
  }

  ring(g, 0.44, 0.50, 'rgba(255,235,185,0.12)');
  ring(g, 0.52, 0.535, 'rgba(40,20,4,0.5)');
  ring(g, 0.41, 0.425, 'rgba(40,20,4,0.4)');
  // a bold counter-clockwise arrow and a tick at the rim, so the turning reads from far away
  g.save(); g.translate(S / 2, S / 2);
  g.strokeStyle = 'rgba(48,26,6,0.85)'; g.lineWidth = 9; g.lineCap = 'round';
  const ar = px(0.28);
  g.beginPath(); g.arc(0, 0, ar, -2.6, 0.55); g.stroke();
  g.beginPath(); g.moveTo(Math.cos(0.55) * ar + 2, Math.sin(0.55) * ar - 4);
  g.lineTo(Math.cos(0.55) * ar + 25, Math.sin(0.55) * ar - 18);
  g.moveTo(Math.cos(0.55) * ar + 2, Math.sin(0.55) * ar - 4);
  g.lineTo(Math.cos(0.55) * ar - 8, Math.sin(0.55) * ar + 24); g.stroke();
  g.strokeStyle = 'rgba(255,235,190,0.35)'; g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, ar + 6, -2.6, 0.55); g.stroke();
  g.fillStyle = 'rgba(40,20,4,0.9)';
  g.beginPath(); g.arc(0, -px(0.675), 9, 0, TAU); g.fill();
  g.restore();

  ring(g, 0.74, 0.82, 'rgba(70,40,12,0.55)');
  // tiny dents & wear
  for (let i = 0; i < 160; i++) {
    const x = br() * S, y = br() * S, r = 0.6 + br() * 2;
    g.fillStyle = `rgba(30,15,4,${0.05 + br() * 0.08})`; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }

  const rough = new THREE.CanvasTexture(rc);

}

function buildLidGeometry() {
  const K = 1;
  const prof = [
    [0.0, 0.25, 0], [0.3, 0.25, 0], [0.6, 0.25, 0], [0.735, 0.25, 0],
    [0.735, 0.15, 0], [0.735, 0.012, 0], [0.745, 0.0, 0], [0.78, 0.0, 0], [0.80, 0.0, 0], [0.806, 0.012, 0.3],
    [0.804, 0.04, K], [0.804, 0.09, K], [0.804, 0.14, K], [0.804, 0.19, K], [0.803, 0.225, 0.5],
    [0.795, 0.258, 0], [0.775, 0.284, 0], [0.745, 0.298, 0], [0.70, 0.302, 0],
    [0.60, 0.300, 0], [0.54, 0.300, 0], [0.52, 0.3055, 0], [0.50, 0.312, 0], [0.45, 0.312, 0], [0.43, 0.3055, 0], [0.41, 0.300, 0],
    [0.2, 0.300, 0], [0.0, 0.300, 0],
  ];
  const SEG = 176, L = prof.length;
  const geo = new THREE.LatheGeometry(prof.map(p => new THREE.Vector2(p[0], p[1])), SEG);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i <= SEG; i++) {
    const phi = i / SEG * TAU;
    const ridge = Math.pow(0.5 + 0.5 * Math.cos(phi * 44), 1.4);
    for (let j = 0; j < L; j++) {
      const v = i * L + j, amp = prof[j][2];
      if (amp > 0) {
        const r = Math.hypot(pos.getX(v), pos.getZ(v));
        const k = 1 + (0.011 * ridge * amp) / r;
        pos.setX(v, pos.getX(v) * k); pos.setZ(v, pos.getZ(v) * k);
      }
      uv.setXY(v, pos.getX(v) / (2 * 0.82) + 0.5, pos.getZ(v) / (2 * 0.82) + 0.5);
    }
  }
  geo.computeVertexNormals();
  const nrm = geo.attributes.normal;
  for (let j = 0; j < L; j++) { // weld the seam's normals
    const a = j, b = SEG * L + j;
    const x = nrm.getX(a) + nrm.getX(b), y = nrm.getY(a) + nrm.getY(b), z = nrm.getZ(a) + nrm.getZ(b);
    const l = Math.hypot(x, y, z) || 1;
    nrm.setXYZ(a, x / l, y / l, z / l); nrm.setXYZ(b, x / l, y / l, z / l);
  }
  return geo;
}

/* ======================================================================

  U.lampView.value.copy(LAMP).applyMatrix4(camera.matrixWorldInverse);

  bubbles.visible = false;

  for (const m of ghostMeshes) m.visible = false;

  for (const m of glassLayers) m.visible = true;
  bubbles.visible = true;

}

  if (avg > 21 && quality.scale > 0.56) { quality.scale = Math.max(0.56, quality.scale * 0.86); perf.calm = 0; resize(); }

/* ---------- controls ---------- */

/* ---------- go: compile every shader variant behind the loading card, then start ---------- */

  ghostU.uOpacity.value = 0;
  const comp = async () => {
    if (renderer.compileAsync) { try { await renderer.compileAsync(scene, camera); return; } catch (e) { /* fall through */ } }
    renderer.compile(scene, camera);
  };
  renderer.setRenderTarget(rt); await comp();
  renderer.setRenderTarget(null); await comp();
  renderFrame();
  for (const m of ghostMeshes) m.visible = false;
}
warmUp().then(() => {
  requestAnimationFrame(t => { last = t; frame(t); });
  setTimeout(() => {
    const l = $('loading'); l.style.opacity = 0; setTimeout(() => l.style.display = 'none', 900);
  }, 250);
});
</script>
</body>
